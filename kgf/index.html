<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a3a9c">
  <title>Įvertinkite mus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/style.css?v=6">
</head>
<body class="review">
  <header class="hero">
    <button class="lang" id="lang" type="button">EN</button>
    <div class="logo" id="logo"></div>
    <p class="biz" id="biz"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <main>
    <!-- 1. Įvertinimas -->
    <section class="card" id="rate-card">
      <h1 data-t="rateTitle"></h1>
      <p class="muted" data-t="rateSub"></p>
      <div class="stars" id="stars"></div>
      <p class="star-label" id="star-label">&nbsp;</p>
    </section>

    <!-- 2. Žemas įvertinimas: atsiliepimo burbulas po žvaigždutėmis -->
    <section class="card bubble" id="form-card" hidden>
      <h2 data-t="badTitle"></h2>
      <p class="muted" data-t="badText"></p>
      <form id="form" novalidate>
        <label for="msg" data-t="msgLabel"></label>
        <textarea id="msg" name="message" maxlength="2000" required></textarea>
        <label for="contact" data-t="contactLabel"></label>
        <input id="contact" name="contact" maxlength="100" autocomplete="tel" inputmode="email" required>
        <p class="hint" data-t="contactHint"></p>
        <label for="name"><span data-t="nameLabel"></span> <small data-t="optional"></small></label>
        <input id="name" name="name" maxlength="100" autocomplete="name">
        <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="error" id="error" hidden></p>
        <button class="btn" type="submit" data-t="send"></button>
      </form>
    </section>

    <!-- 3. Ačiū -->
    <section class="card" id="done-card" hidden>
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
      <h2 data-t="doneTitle"></h2>
      <p class="muted" id="promise"></p>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="config.js?v=6"></script>
  <script src="../assets/common.js?v=6"></script>
  <script src="../assets/review.js?v=6"></script>
</body>
</html>
