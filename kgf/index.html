<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a3a9c">
  <title>Įvertinkite mus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/style.css?v=5">
</head>
<body class="review">
  <header class="hero">
    <button class="lang" id="lang" type="button">EN</button>
    <div class="logo" id="logo"></div>
    <p class="biz" id="biz"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <main class="card">
    <!-- 1. Įvertinimas -->
    <section class="step" id="step-rate">
      <h1 data-t="rateTitle"></h1>
      <p class="muted" data-t="rateSub"></p>
      <div class="stars" id="stars"></div>
      <p class="star-label" id="star-label">&nbsp;</p>
    </section>

    <!-- 2a. Geras įvertinimas -> Google -->
    <section class="step" id="step-good" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <h2 data-t="goodTitle"></h2>
      <p class="muted" data-t="goodText"></p>
      <a class="btn google" id="google-btn" href="#" rel="noopener">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-t="googleBtn"></span>
      </a>
      <p class="center"><button class="link" type="button" data-back data-t="change"></button></p>
    </section>

    <!-- 2b. Žemas įvertinimas -> privatus atsiliepimas -->
    <section class="step" id="step-bad" hidden>
      <div class="mini-stars" id="mini-stars"></div>
      <h2 data-t="badTitle"></h2>
      <p class="muted" data-t="badText"></p>
      <p class="private">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>
        <span data-t="private"></span>
      </p>
      <form id="form" novalidate>
        <label for="msg" data-t="msgLabel"></label>
        <textarea id="msg" name="message" maxlength="2000" required></textarea>
        <label for="contact" data-t="contactLabel"></label>
        <input id="contact" name="contact" maxlength="100" autocomplete="tel" inputmode="email" required>
        <p class="hint" data-t="contactHint"></p>
        <label for="name"><span data-t="nameLabel"></span> <small data-t="optional"></small></label>
        <input id="name" name="name" maxlength="100" autocomplete="name">
        <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="error" id="error" hidden></p>
        <button class="btn" type="submit" data-t="send"></button>
      </form>
      <p class="center"><button class="link" type="button" data-back data-t="change"></button></p>
    </section>

    <!-- 3. Ačiū -->
    <section class="step" id="step-done" hidden>
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
      <h2 data-t="doneTitle"></h2>
      <p class="muted" id="promise"></p>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="config.js?v=5"></script>
  <script src="../assets/common.js?v=5"></script>
  <script src="../assets/review.js?v=5"></script>
</body>
</html>
