<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a3a9c">
  <title>Įvertinkite mus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../assets/style.css?v=10">
</head>
<body class="review">
  <!-- Žvaigždučių spalvų perėjimas -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="star-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd84d"/>
        <stop offset="1" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="hero">
    <button class="lang" id="lang" type="button">EN</button>
    <div class="logo" id="logo"></div>
    <p class="biz" id="biz"></p>
    <p class="tagline" id="tagline"></p>
    <svg class="wave" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40V22C80 2 160 0 200 10s120 30 200 6v24z"/></svg>
  </header>

  <main>
    <!-- 1. Įvertinimas -->
    <section class="card" id="rate-card">
      <h1 data-t="rateTitle"></h1>
      <p class="muted" data-t="rateSub"></p>
      <div class="stars" id="stars"></div>
      <p class="star-label" id="star-label"></p>
    </section>

    <!-- 2. Žemas įvertinimas: atsiliepimo burbulas po žvaigždutėmis -->
    <section class="card bubble" id="form-card" hidden>
      <h2 data-t="badTitle"></h2>
      <p class="muted" data-t="badText"></p>
      <form id="form" novalidate>
        <label for="msg" data-t="msgLabel"></label>
        <div class="field area">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 5v2h10V9H7zm0 4v2h6v-2H7z"/></svg>
          <textarea id="msg" name="message" maxlength="2000" required></textarea>
        </div>
        <label for="contact" data-t="contactLabel"></label>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          <input id="contact" name="contact" maxlength="100" autocomplete="tel" inputmode="email" required>
        </div>
        <p class="hint" data-t="contactHint"></p>
        <label for="name"><span data-t="nameLabel"></span> <small data-t="optional"></small></label>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v2h18v-2c0-2.8-4.6-5-9-5z"/></svg>
          <input id="name" name="name" maxlength="100" autocomplete="name">
        </div>
        <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="error" id="error" hidden></p>
        <button class="btn" type="submit">
          <span data-t="send"></span>
        </button>
      </form>
    </section>

    <!-- 3. Ačiū -->
    <section class="card" id="done-card" hidden>
      <div class="burst" aria-hidden="true">
        <i style="--a:0deg"></i><i style="--a:45deg"></i><i style="--a:90deg"></i><i style="--a:135deg"></i>
        <i style="--a:180deg"></i><i style="--a:225deg"></i><i style="--a:270deg"></i><i style="--a:315deg"></i>
        <svg class="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
      </div>
      <h2 data-t="doneTitle"></h2>
      <p class="muted" id="promise"></p>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="config.js?v=10"></script>
  <script src="../assets/common.js?v=10"></script>
  <script src="../assets/review.js?v=10"></script>
</body>
</html>
