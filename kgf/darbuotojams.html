<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Atsiliepimo prašymas</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="card wide">
    <h2>Paprašyti atsiliepimo</h2>
    <p class="muted">Įveskite kliento telefoną arba el. paštą ir spauskite „Siųsti automatiškai“ – sistema pati išsiųs žinutę nurodytu laiku.</p>

    <form id="form" novalidate>
      <div id="pin-wrap">
        <label for="pin">Darbuotojų PIN <span>(įvedus vieną kartą, įsimenamas)</span></label>
        <input id="pin" inputmode="numeric" autocomplete="off">
      </div>
      <div id="staff-wrap" hidden>
        <label for="staff">Darbuotojas</label>
        <select id="staff"></select>
      </div>
      <label for="to">Telefonas arba el. paštas</label>
      <input id="to" inputmode="email" autocomplete="off" placeholder="8 600 00000 arba vardas@pastas.lt">
      <label for="cname">Kliento vardas <span>(neprivaloma)</span></label>
      <input id="cname" autocomplete="off">
      <label for="when">Kada siųsti</label>
      <select id="when">
        <option value="1h">Po 1 valandos</option>
        <option value="now">Dabar</option>
        <option value="1d">Rytoj</option>
      </select>
      <label for="text">Žinutė</label>
      <textarea id="text"></textarea>
      <p class="error" id="error" hidden></p>
      <p class="ok" id="ok" hidden></p>
      <button class="btn" type="button" id="auto">✅ Siųsti automatiškai</button>
      <div class="row">
        <button class="btn secondary" type="button" id="manual">📱 Per savo telefoną</button>
        <button class="btn secondary" type="button" id="qr">📷 Rodyti QR</button>
      </div>
      <button class="btn secondary" type="button" id="copy">📋 Kopijuoti nuorodą</button>
    </form>

    <div class="qr-box" id="qr-box" hidden>
      <p><b>Tegul klientas nuskenuoja telefonu</b></p>
      <div id="qr-code"></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="../assets/common.js"></script>
  <script src="../assets/vendor/qrcode.js"></script>
  <script src="../assets/staff.js"></script>
</body>
</html>
